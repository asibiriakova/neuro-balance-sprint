openapi: 3.0.3
info:
  title: NeuroSprint API
  description: |
    Backend contract implied by the frontend's service layer
    (`frontend/src/services/sprint-service.ts` and `planning-service.ts`).

    Today both services are implemented by localStorage-backed / keyword-matched
    mocks (`MockSprintService`, `MockPlanningService`) with no real network calls
    and no login screen, so the frontend itself never sends credentials. This
    spec anticipates the real backend described in `_docs/plan.md` (FastAPI +
    PostgreSQL, Phase 1 = "Data Modeling & Auth"): a single authenticated user
    owns one sprint at a time, so every resource below is scoped to the caller
    and requires a bearer token.

    All sprint-mutating endpoints return the full, updated `SprintData` object,
    matching every `SprintService` method's `Promise<SprintData>` return type.
  version: "1.0.0"

servers:
  - url: /api

security:
  - bearerAuth: []

tags:
  - name: sprint
    description: The active 21-day sprint (tasks, daily state logs, priorities, gratitude, archive).
  - name: planning
    description: The Planning Canvas's AI assistant that decomposes goals into tasks.

paths:
  /sprints/current:
    get:
      operationId: getCurrentSprint
      tags: [sprint]
      summary: Get the current sprint's full state
      description: Backs `SprintService.getSprint()`.
      responses:
        "200":
          description: The current sprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The authenticated user has no active sprint.

  /sprints/current/state:
    post:
      operationId: setTodayState
      tags: [sprint]
      summary: Log today's NeuroBalance state
      description: |
        Sets the `state` on today's `DayLog` entry (the log whose `day` equals
        the sprint's current `day`). Backs `SprintService.setTodayState(state)`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  $ref: "#/components/schemas/StateId"
      responses:
        "200":
          description: The updated sprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintData"
        "400":
          description: Invalid state value.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The authenticated user has no active sprint.

  /sprints/current/tasks:
    post:
      operationId: addTask
      tags: [sprint]
      summary: Add a task to the sprint backlog
      description: Appends a new, not-done task. Backs `SprintService.addTask(task)`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTaskInput"
      responses:
        "200":
          description: The updated sprint, including the newly created task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintData"
        "400":
          description: Invalid task input (e.g. hours would exceed the pillar/sprint cap).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The authenticated user has no active sprint.

  /sprints/current/tasks/{taskId}/toggle-done:
    patch:
      operationId: toggleTask
      tags: [sprint]
      summary: Toggle a task's completion status
      description: Flips `Task.done`. Backs `SprintService.toggleTask(taskId)`.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The updated sprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Sprint or task not found.

  /sprints/current/tasks/{taskId}/toggle-priority:
    patch:
      operationId: togglePriority
      tags: [sprint]
      summary: Toggle a task in/out of today's top-3 priorities
      description: |
        Adds `taskId` to `SprintData.priorities` if absent, or removes it if
        present. A no-op if the task is not already a priority and 3
        priorities are already selected (silently returns the unchanged
        sprint, matching `MockSprintService.togglePriority`). Backs
        `SprintService.togglePriority(taskId)`.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The updated (or unchanged, if already at the 3-priority cap) sprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Sprint or task not found.

  /sprints/current/gratitude:
    put:
      operationId: setGratitude
      tags: [sprint]
      summary: Save today's "remarkable moment" gratitude note
      description: Replaces `SprintData.gratitude`. Backs `SprintService.setGratitude(value)`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  description: Free-text gratitude / "remarkable moment" note.
      responses:
        "200":
          description: The updated sprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The authenticated user has no active sprint.

  /planning/assistant:
    post:
      operationId: getAssistantReply
      tags: [planning]
      summary: Ask the planning assistant to decompose a goal
      description: |
        Sends free-text to the AI planning coach and gets back a reply plus
        optional pillar-tagged task suggestions the user can drop onto the
        Sprint Canvas. Backs `PlanningService.getAssistantReply(prompt)`.
        Per `_docs/plan.md`, this is proxied server-side to the Gemini API —
        the frontend never calls the AI provider directly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  description: The user's free-text goal or question.
      responses:
        "200":
          description: The assistant's reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningReply"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: The upstream AI provider call failed.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Every endpoint is scoped to the authenticated user (their sprint,
        their tasks, their planning conversation) and requires this token.

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
      description: Id of the task within the current sprint.

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.

  schemas:
    StateId:
      type: string
      description: One of the 7 NeuroBalance states, in escalation order.
      enum:
        - apathy
        - passivity
        - relaxation
        - balance
        - engagement
        - overarousal
        - panic

    PillarId:
      type: string
      description: One of the 3 sprint pillars.
      enum: [foundation, drive, joy]

    Task:
      type: object
      required: [id, title, hours, pillar, done]
      properties:
        id:
          type: string
        title:
          type: string
        hours:
          type: number
          minimum: 0
          description: Estimated hours, counted against the 10h/pillar and 30h/sprint caps.
        pillar:
          $ref: "#/components/schemas/PillarId"
        done:
          type: boolean

    NewTaskInput:
      type: object
      required: [title, hours, pillar]
      properties:
        title:
          type: string
        hours:
          type: number
          minimum: 0
        pillar:
          $ref: "#/components/schemas/PillarId"

    DayLog:
      type: object
      required: [day, state]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 21
        state:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StateId"
        priorities:
          type: array
          items:
            type: string
          description: Task ids marked as top-3 priorities on this day.
        gratitude:
          type: string

    ArchivedSprint:
      type: object
      required: [id, name, range, dominant, completion, insight]
      properties:
        id:
          type: string
        name:
          type: string
        range:
          type: string
          description: Human-readable date range, e.g. "12 Jun – 3 Jul".
        dominant:
          $ref: "#/components/schemas/StateId"
        completion:
          type: number
          description: Completion percentage (0–100).
        insight:
          type: string
          description: Retrospective takeaway from the sprint.

    SprintData:
      type: object
      description: Everything the app persists for the active 21-day sprint.
      required:
        - sprintNumber
        - day
        - tasks
        - logs
        - priorities
        - gratitude
        - committed
        - archive
      properties:
        sprintNumber:
          type: integer
        day:
          type: integer
          minimum: 1
          maximum: 21
          description: The current day of the sprint.
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        logs:
          type: array
          items:
            $ref: "#/components/schemas/DayLog"
          description: One entry per sprint day (21 total).
        priorities:
          type: array
          items:
            type: string
          description: Task ids selected as today's top-3 priorities (max 3).
          maxItems: 3
        gratitude:
          type: string
          description: Today's "remarkable moment" note.
        committed:
          type: boolean
          description: Whether the backlog has been committed (locked in) for this sprint.
        archive:
          type: array
          items:
            $ref: "#/components/schemas/ArchivedSprint"
          description: Past, completed sprints.

    PlanningSuggestion:
      type: object
      required: [title, hours, pillar]
      properties:
        title:
          type: string
        hours:
          type: number
          minimum: 0
        pillar:
          $ref: "#/components/schemas/PillarId"

    PlanningReply:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The assistant's conversational reply.
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/PlanningSuggestion"
          description: Optional task suggestions the user can add to the sprint backlog.
